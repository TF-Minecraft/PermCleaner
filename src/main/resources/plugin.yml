main: net.tfminecraft.permcleaner.PermCleaner
api-version: 1.21
name: PermCleaner
version: ${project.version}
author: TFMC

depend: [TLibs, LuckPerms]

commands:
  permcleaner:
    description: PermCleaner admin tools
    usage: /permcleaner <reload|status|inspect|clean|force> [player]
    permission: permcleaner.admin
    permission-message: You do not have permission to use /permcleaner.

permissions:
  permcleaner.admin:
    description: Admin commands for PermCleaner
    default: op
